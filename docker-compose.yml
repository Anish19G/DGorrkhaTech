services:
  postgres:
    image: postgres:16-alpine
    container_name: dgorkhatech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dgorkhatech
      POSTGRES_PASSWORD: dgorkhatech
      POSTGRES_DB: dgorkhatech
    ports:
      - "5433:5432"
    volumes:
      - dgorkhatech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dgorkhatech -d dgorkhatech"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dgorkhatech_pgdata:
